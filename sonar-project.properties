# Scan into the SonarQube server shared by every project on this computer (#153).
# Run: pnpm sonar (scripts/sonar.ts). Setup: README.md, "Code quality scan".
sonar.projectKey=stash
sonar.projectName=stash
sonar.sourceEncoding=UTF-8

sonar.sources=apps,packages,scripts
