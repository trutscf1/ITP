services:
  
  postgres:
    image: postgres:18
    container_name: stash_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stash_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-etc:/etc
      - postgres-data:/var/lib/postgresql

  mongodb:
    hostname: mongodb
    image: mongo:8.0
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGODB_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    ports:
      - 27017:27017
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb

  # Applies the pending migrations of the relational schema once and exits (SCF-F-26, SCF-E-7).
  # Every service that uses the relational database depends on it with
  # `condition: service_completed_successfully`. Needs the health check of `postgres` (!17).
  db-migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stash_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

networks:
  frontend:
  backend:

volumes:
  postgres-data:
  postgres-etc:
  mongo-data:
  mongo-config: