# Local stack (SCF-US-2, slice 1): the data services, the reverse proxy, and `web`, started by
# one `docker compose up`. Every setting comes from `.env` (SCF-AC-2.2); `.env.example` lists
# every variable. Every service has a health check, and a service starts only after the
# services it depends on are healthy (SCF-AC-2.4). The units `identity`, `storage`, `worker`,
# and `cms` join when their code runs (gam-ai-knowledge/concepts/scaffolding.md, SCF-F-1).
services:
  # Relational database (SCF-C-8).
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks:
      - backend
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?set POSTGRES_PORT in .env}:5432"
    volumes:
      # PostgreSQL 18 keeps its data in a versioned folder below /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Sessions, cache, and the job queue.
  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # Read by redis-cli, so the health check does not put the password on a command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks:
      - backend
    ports:
      - "127.0.0.1:${REDIS_PORT:?set REDIS_PORT in .env}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # File metadata.
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    networks:
      - backend
    ports:
      - "127.0.0.1:${MONGO_PORT:?set MONGO_PORT in .env}:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Synchronisation for the offline mode.
  couchdb:
    image: couchdb:3.5
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?set COUCHDB_USER in .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD in .env}
    networks:
      - backend
    ports:
      - "127.0.0.1:${COUCHDB_PORT:?set COUCHDB_PORT in .env}:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Object storage with an S3 interface. The master answers on 9333 once the server is up.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: ["server", "-dir=/data", "-filer", "-s3"]
    networks:
      - backend
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:?set SEAWEEDFS_S3_PORT in .env}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Virus scanner. The image brings its own health check script; the first start loads the
  # virus definitions, which takes a while. The image exists for amd64 only, so ARM machines
  # (Apple Silicon) run it emulated; it starts more slowly there (#148).
  clamav:
    image: clamav/clamav:1.5
    platform: linux/amd64
    restart: unless-stopped
    environment:
      # "true" keeps the scanner from downloading definitions, so it starts offline with the
      # ones in the image (SCF-AC-2.3); set "false" to update them while online.
      CLAMAV_NO_FRESHCLAMD: ${CLAMAV_NO_FRESHCLAMD:?set CLAMAV_NO_FRESHCLAMD in .env}
    networks:
      - backend
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Local replacement for outgoing e-mail (SCF-AC-2.3): catches every message; the inbox is
  # at http://localhost:${MAILPIT_UI_PORT}.
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:?set MAILPIT_UI_PORT in .env}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # The `web` unit (Next.js). docker/web.Dockerfile is a temporary stop-gap; M9 of the track plan
  # Web (gam-ai-knowledge/concepts/scaffolding.track-web.md) replaces it with apps/web/Dockerfile.
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${WEB_PORT:?set WEB_PORT in .env}
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # External services are switched off by default; e-mail goes to mailpit (SCF-AC-2.3).
      OAUTH_ENABLED: ${OAUTH_ENABLED:?set OAUTH_ENABLED in .env}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:?set CAPTCHA_ENABLED in .env}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend
    healthcheck:
      # `/` until `web` has `/health`: `/` becomes a redirect with R11 (public content), and M9
      # moves this check to `/health`.
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:$${PORT}/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Reverse proxy: one origin for the browser (SCF-F-4). Routes for the other units are added
  # in docker/Caddyfile as they join the stack.
  proxy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      WEB_PORT: ${WEB_PORT:?set WEB_PORT in .env}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend
    ports:
      - "${PROXY_PORT:?set PROXY_PORT in .env}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/proxy-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Applies the pending migrations of the relational schema once and exits (SCF-F-26, SCF-E-7).
  # Every service that uses the relational database depends on it with
  # `condition: service_completed_successfully`. Needs the health check of `postgres` (!17).
  db-migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  # Observability stack (profile "observability", OBS-F-5; concept observability.md §16, slice 1
  # of OBS-US-1). The six containers share the memory budget of OBS-NF-8 (1472 MB of 1536 MB);
  # none publishes a port except the dashboard tool on 127.0.0.1 (OBS-NF-7). The configuration
  # step runs first, the collector and the stores start after it ended with 0, the dashboard tool
  # after the stores are healthy. Remove the profile from COMPOSE_PROFILES in .env to start
  # without the stack.

  # Checks the variables of the stack and writes the configuration of the trace store (OBS-F-28,
  # OBS-E-4); a one-shot container like db-migrate.
  obs-config:
    image: node:24.14-alpine
    profiles: [observability]
    restart: "no"
    mem_limit: 64m
    command: ["node", "/obs/check-config.ts"]
    environment:
      OBS_METRICS_RETENTION_DAYS: ${OBS_METRICS_RETENTION_DAYS:-15}
      OBS_LOGS_RETENTION_DAYS: ${OBS_LOGS_RETENTION_DAYS:-7}
      OBS_TRACES_RETENTION_DAYS: ${OBS_TRACES_RETENTION_DAYS:-7}
      OBS_ALERT_ERROR_RATE_PERCENT: ${OBS_ALERT_ERROR_RATE_PERCENT:-5}
      OBS_ALERT_MIN_REQUESTS: ${OBS_ALERT_MIN_REQUESTS:-20}
      OBS_ALERT_STORAGE_PERCENT: ${OBS_ALERT_STORAGE_PERCENT:-90}
      OBS_ALERT_QUEUE_MIN_WAITING: ${OBS_ALERT_QUEUE_MIN_WAITING:-10}
      OBS_ALERT_SILENT_MINUTES: ${OBS_ALERT_SILENT_MINUTES:-2}
      OBS_DASHBOARD_PORT: ${OBS_DASHBOARD_PORT:-3300}
    volumes:
      - ./docker/observability:/obs:ro
      - obs-generated:/generated
    networks:
      - backend

  # Receives metrics, log entries, and spans, removes person identifiers, and routes each kind to
  # its store (OBS-C-2, OBS-F-2, OBS-F-29).
  collector:
    build:
      context: .
      dockerfile: docker/observability/collector.Dockerfile
    profiles: [observability]
    restart: unless-stopped
    mem_limit: 192m
    command: ["--config", "/etc/collector.yaml"]
    depends_on:
      obs-config:
        condition: service_completed_successfully
    networks:
      - backend
    volumes:
      - ./docker/observability/collector.yaml:/etc/collector.yaml:ro
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-qO", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Metric store (OBS-C-3): OTLP receiver, retention from OBS_METRICS_RETENTION_DAYS.
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [observability]
    restart: unless-stopped
    mem_limit: 384m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${OBS_METRICS_RETENTION_DAYS:-15}d
      - --web.enable-otlp-receiver
    depends_on:
      obs-config:
        condition: service_completed_successfully
    networks:
      - backend
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Log store (OBS-C-4): OTLP ingestion, retention from OBS_LOGS_RETENTION_DAYS.
  loki:
    build:
      context: .
      dockerfile: docker/observability/loki.Dockerfile
    profiles: [observability]
    restart: unless-stopped
    mem_limit: 320m
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      OBS_LOGS_RETENTION_DAYS: ${OBS_LOGS_RETENTION_DAYS:-7}
    depends_on:
      obs-config:
        condition: service_completed_successfully
    networks:
      - backend
    volumes:
      - ./docker/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-qO", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Trace store (OBS-C-5): OTLP ingestion; obs-config writes its configuration with the retention
  # of OBS_TRACES_RETENTION_DAYS.
  tempo:
    build:
      context: .
      dockerfile: docker/observability/tempo.Dockerfile
    profiles: [observability]
    restart: unless-stopped
    mem_limit: 256m
    command: ["-config.file=/generated/tempo.yaml"]
    depends_on:
      obs-config:
        condition: service_completed_successfully
    networks:
      - backend
    volumes:
      - obs-generated:/generated:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-qO", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Dashboard tool (OBS-C-6). Slice 1 starts it empty; data sources, dashboards, and alert rules
  # come with OBS-US-2. Until TLS exists it is reachable on the server itself only, with
  # read-only anonymous access (OBS-F-10, OBS-F-24). No login form, no self-registration, no
  # update check, no usage reporting, no plugin download (OBS-NF-1, OBS-NF-6).
  grafana:
    image: grafana/grafana:13.2.5
    profiles: [observability]
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      obs-config:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "127.0.0.1:${OBS_DASHBOARD_PORT:-3300}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  frontend:
  backend:

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  mongo-config:
  couchdb-data:
  seaweedfs-data:
  clamav-data:
  proxy-data:
  obs-generated:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
