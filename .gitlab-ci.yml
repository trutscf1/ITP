# CI pipeline (SCF-US-5, gam-ai-knowledge/concepts/scaffolding.md SCF-F-15).
# One pipeline per change: a merge request pipeline while an MR is open, otherwise a branch
# pipeline for every push (feature branches, dev, main) — SCF-AC-5.1.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    # A release tag runs the checks once more and publishes the GitLab Release (SCF-AC-6.3).
    - if: $CI_COMMIT_TAG

include:
  - local: .gitlab/ci/docs.yml

stages:
  - test
  - release

# A run must finish in under 10 minutes (SCF-AC-5.4); a job that hangs fails instead of
# blocking the merge request. A newer push cancels the older, now pointless run.
default:
  timeout: 10m
  interruptible: true

# Node.js as pinned in .tool-versions, pnpm as pinned in package.json (SCF-AC-1.4); a test
# keeps the image tag and .tool-versions equal.
.pnpm:
  image: node:24.14.0-alpine
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  # The pnpm store changes only with the lockfile. Turborepo entries are addressed by the hash
  # of their inputs, so one cache per job can be shared by all branches; GitLab still keeps
  # protected branches (dev, main) apart from the others.
  cache:
    - &pnpm-store
      key:
        files:
          - pnpm-lock.yaml
      paths:
        - .pnpm-store
    - key: turbo-$CI_JOB_NAME
      paths:
        - .turbo/cache

lint:
  extends: .pnpm
  stage: test
  script:
    - pnpm run lint
    # The units' lint tasks cover only their own folders; this covers the root files as well.
    - pnpm exec biome ci .

typecheck:
  extends: .pnpm
  stage: test
  script:
    - pnpm run typecheck

# `pnpm test` is `turbo run test` (SCF-F-12): the unit tests of every unit and package and the
# acceptance tests of the repository. The task is never cached (turbo.json).
test:
  extends: .pnpm
  stage: test
  cache:
    - *pnpm-store
  # The tests of the relational schema create their own databases on this server
  # (SCF-US-4, gam-ai-knowledge/concepts/scaffolding.md §17). Throwaway credentials of the job.
  services:
    - name: postgres:18-alpine
      alias: postgres
  variables:
    POSTGRES_DB: stash
    POSTGRES_USER: stash
    POSTGRES_PASSWORD: change-me
    TEST_DATABASE_URL: postgresql://stash:change-me@postgres:5432/stash
  script:
    - pnpm test

build:
  extends: .pnpm
  stage: test
  script:
    - pnpm run build

# Accessibility check with axe on the built web client; fails on a critical violation
# (SCF-AC-5.2, SCF-AC-5.3). The image tag equals the Playwright version in package.json.
accessibility:
  extends: .pnpm
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  stage: test
  variables:
    PORT: "3000"
    BASE_URL: http://localhost:$PORT
  script:
    # The Playwright image brings its own Node.js; it must have the major version of
    # .tool-versions (SCF-AC-1.4).
    - pinned=$(awk '/^nodejs/ {split($2, v, "."); print v[1]}' .tool-versions)
    - test "$(node -p 'process.versions.node.split(".")[0]')" = "$pinned"
    - pnpm exec turbo run build --filter=@stash/web
    # The check waits for the server itself and fails if it does not come up.
    - pnpm --filter @stash/web exec next start --port "$PORT" &
    - pnpm run test:accessibility

# Production dependencies with a known high or critical vulnerability fail the pipeline
# (SCF-AC-5.2, SCF-AC-5.3, docs/security_next_js.md).
dependency-audit:
  extends: .pnpm
  stage: test
  cache:
    - *pnpm-store
  script:
    - pnpm audit --prod --audit-level=high

# Every image the stack uses, scanned for known high and critical vulnerabilities that have a
# fix (SCF-AC-2.5, SCF-AC-5.2, SCF-AC-5.3, SCF-NF-6). The job builds every image the stack
# builds, in every profile, on its own Docker daemon, and takes the image list from the stack
# definition, so built and pulled images are scanned alike (#149). Accepted exceptions with
# reason and expiry: .trivyignore for every image, .trivyignore.d/<service> in addition for the
# image that service builds only; the fixed project name stash names the built images
# stash-<service>. Trivy is copied out of its pinned image. Every image is scanned before the
# job fails, so one run lists all findings.
container-scan:
  stage: test
  image: docker:29.9.2
  services:
    - name: docker:29.9.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    TRIVY_CACHE_DIR: .trivy-cache
  cache:
    - key: trivy
      paths:
        - .trivy-cache
  script:
    - docker create --name trivy aquasec/trivy:0.69.3
    - docker cp trivy:/usr/local/bin/trivy /usr/local/bin/trivy
    - docker rm trivy
    # .env.example only fills the required variables of the stack definition; nothing is started.
    - docker compose -p stash --env-file .env.example --profile "*" build
    - images=$(docker compose -p stash --env-file .env.example --profile "*" config --images)
    - |
      failed=""
      for image in $images; do
        cp .trivyignore /tmp/trivyignore
        own=".trivyignore.d/${image#stash-}"
        if [ -f "$own" ]; then printf '\n' >> /tmp/trivyignore; cat "$own" >> /tmp/trivyignore; fi
        trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /tmp/trivyignore --exit-code 1 "$image" || failed="$failed $image"
      done
      if [ -n "$failed" ]; then
        echo "Images with findings:$failed"
        exit 1
      fi

# Secrets in the history of the checked-out commit (SCF-F-15, docs/security_next_js.md).
secret-scan:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.30.0
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="HEAD" .

# Code scan with the rule sets of docs/security_next_js.md; any finding fails (SCF-F-15).
code-scan:
  stage: test
  image: semgrep/semgrep:1.148.0
  variables:
    SEMGREP_SEND_METRICS: "off"
  script:
    # The image expects the code in /src unless SEMGREP_IN_DOCKER is unset; GitLab checks it out
    # elsewhere.
    - unset SEMGREP_IN_DOCKER
    - semgrep scan --config p/javascript --config p/typescript --config p/react --config p/nodejs --config p/owasp-top-ten --config .semgrep.yml --error

# The commit messages of the change, checked again (SCF-F-13): in a merge request every commit
# since the merge base, on a branch every commit not yet on the default branch.
commit-messages:
  extends: .pnpm
  stage: test
  cache:
    - *pnpm-store
  variables:
    GIT_DEPTH: 0
  script:
    - apk add --no-cache git
    - git fetch --quiet origin "$CI_DEFAULT_BRANCH"
    - base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$(git merge-base HEAD "origin/$CI_DEFAULT_BRANCH")}"
    - pnpm exec commitlint --from "$base" --to HEAD --verbose

# Release notes for a pushed tag: the tag must be SemVer (v1.0.0) and CHANGELOG.md must have
# its section, otherwise the job fails and no release is published (SCF-AC-6.3).
release-notes:
  stage: release
  image: node:24.14.0-alpine
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - node scripts/changelog.ts notes "$CI_COMMIT_TAG" > release-notes.md
  artifacts:
    paths:
      - release-notes.md

# The GitLab Release for the tag, with the notes of its changelog section (SCF-AC-6.3).
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.74.0
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - release-notes
  script:
    - echo "Publishing the release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release-notes.md
