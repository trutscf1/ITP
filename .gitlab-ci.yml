# CI pipeline (SCF-US-5, documentation/concepts/scaffolding.md SCF-F-15).
# One pipeline per change: a merge request pipeline while an MR is open, otherwise a branch
# pipeline for every push (feature branches, dev, main) — SCF-AC-5.1.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

include:
  - local: .gitlab/ci/docs.yml

stages:
  - test

# A run must finish in under 10 minutes (SCF-AC-5.4); a job that hangs fails instead of
# blocking the merge request. A newer push cancels the older, now pointless run.
default:
  timeout: 10m
  interruptible: true

# Node.js and pnpm as pinned in .tool-versions and package.json (SCF-AC-1.4).
.pnpm:
  image: node:24-alpine
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  # The pnpm store changes only with the lockfile; the Turborepo cache is kept per job and
  # branch, and a new branch starts from the cache of the default branch.
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - .pnpm-store
    - key: turbo-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - turbo-$CI_JOB_NAME-$CI_DEFAULT_BRANCH
      paths:
        - .turbo/cache

lint:
  extends: .pnpm
  stage: test
  script:
    - pnpm run lint

typecheck:
  extends: .pnpm
  stage: test
  script:
    - pnpm run typecheck

test:
  extends: .pnpm
  stage: test
  script:
    - pnpm test

build:
  extends: .pnpm
  stage: test
  script:
    - pnpm run build
