# Telemetry collector (OBS-C-2; concept observability.md §16, M7). It receives metrics, log
# entries, and spans over OTLP on the internal network, removes everything that identifies a
# person (OBS-F-29, OBS-NF-2), batches for at most 5 seconds (OBS-NF-3), and forwards each kind
# to its own store only (OBS-F-2). A store that does not answer is retried after 1, 2, 4, 8, 16,
# and then every 30 seconds; items older than 5 minutes are dropped (OBS-E-2).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 150
    spike_limit_mib: 30

  batch:
    timeout: 5s

  # Allowed span attributes (OBS-F-29, §8): the neutral names of the concept and the keys of the
  # telemetry protocol that STACK.md §1 maps them to. Every other key is dropped, and so is every
  # attribute of a span event (exception messages could name a person).
  transform/spans:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - keep_matching_keys(span.attributes, "^(unit|version|route|method|status code|peer unit|queue|job name|job id|outcome|error type|http\\.route|http\\.request\\.method|http\\.response\\.status_code|server\\.address|messaging\\.destination\\.name|messaging\\.operation\\.name|messaging\\.message\\.id|error\\.type)$")
      - context: spanevent
        statements:
          - delete_matching_keys(spanevent.attributes, ".*")

  # Log entries: client detail list of §8 (a key equal to a name, or ending with ".", "_", or "-"
  # and the name, ignoring case) is dropped; patterns in the message and in attribute values are
  # replaced by [redacted]. The attribute "level" feeds the label of the log store (OBS-C-4).
  transform/logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - delete_matching_keys(log.attributes, "(?i)^(.*[._-])?(ip|client\\.address|remote\\.address|user_agent|user-agent|url|url\\.full|path|query|header|headers|email|name\\.first|name\\.last|member\\.id|user\\.id|file\\.name|folder\\.name)$")
          - set(log.attributes["level"], log.severity_text) where log.severity_text != ""
          # E-mail address, then IPv4 address (twice in the text and in the attribute values, so
          # that two addresses separated by one character are both found), then IPv6 address.
          - replace_pattern(log.body, "[^\\s@]+@[^\\s@]+\\.[^\\s@]+", "[redacted]")
          - replace_all_patterns(log.attributes, "value", "[^\\s@]+@[^\\s@]+\\.[^\\s@]+", "[redacted]")
          - replace_pattern(log.body, "(^|[^0-9.])(\\d{1,3}\\.){3}\\d{1,3}($|[^0-9.])", "$${1}[redacted]$${3}")
          - replace_pattern(log.body, "(^|[^0-9.])(\\d{1,3}\\.){3}\\d{1,3}($|[^0-9.])", "$${1}[redacted]$${3}")
          - replace_all_patterns(log.attributes, "value", "(^|[^0-9.])(\\d{1,3}\\.){3}\\d{1,3}($|[^0-9.])", "$${1}[redacted]$${3}")
          - replace_all_patterns(log.attributes, "value", "(^|[^0-9.])(\\d{1,3}\\.){3}\\d{1,3}($|[^0-9.])", "$${1}[redacted]$${3}")
          - replace_pattern(log.body, "(?i)([0-9a-f]{1,4}:){7}[0-9a-f]{1,4}|([0-9a-f]{1,4}:){1,7}:([0-9a-f]{1,4}(:[0-9a-f]{1,4}){0,6})?|::([0-9a-f]{1,4}:){0,6}[0-9a-f]{1,4}", "[redacted]")
          - replace_all_patterns(log.attributes, "value", "(?i)([0-9a-f]{1,4}:){7}[0-9a-f]{1,4}|([0-9a-f]{1,4}:){1,7}:([0-9a-f]{1,4}(:[0-9a-f]{1,4}){0,6})?|::([0-9a-f]{1,4}:){0,6}[0-9a-f]{1,4}", "[redacted]")

  # Secret key fragments and secret keys of §8: the processor masks the value with ****, the next
  # statement turns the mask into the agreed text.
  redaction/logs:
    allow_all_keys: true
    blocked_key_patterns:
      - "(?i).*(password|passwd|secret|token|authorization|cookie|apikey|api_key|api-key|session|credential|totp|otp|backupcodes|recoverycode).*"
      - "(?i)^(code|state)$"
    summary: silent

  transform/mask:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_all_patterns(log.attributes, "value", "^\\*\\*\\*\\*$", "[redacted]")

exporters:
  otlphttp/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    retry_on_failure: &retry
      enabled: true
      initial_interval: 1s
      multiplier: 2
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue: &queue
      enabled: true
      queue_size: 1000

  otlphttp/loki:
    logs_endpoint: http://loki:3100/otlp/v1/logs
    retry_on_failure: *retry
    sending_queue: *queue

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    retry_on_failure: *retry
    sending_queue: *queue

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/logs, redaction/logs, transform/mask, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/spans, batch]
      exporters: [otlp/tempo]
  telemetry:
    metrics:
      level: none
