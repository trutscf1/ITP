# Log store (OBS-C-4), started with -config.expand-env=true so that the retention comes from
# OBS_LOGS_RETENTION_DAYS (OBS-NF-4). Reached only on the internal network (OBS-NF-7).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${OBS_LOGS_RETENTION_DAYS}d
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service.name
    log_attributes:
      - action: index_label
        attributes:
          - level

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# No usage reporting and no update check to the internet (OBS-NF-1).
analytics:
  reporting_enabled: false
