# Metric store (OBS-C-3). It receives metrics from the collector over its OTLP receiver
# (--web.enable-otlp-receiver); nothing is scraped. Alert rules are evaluated every 60 seconds
# (OBS-F-8) and join with the alert rules of OBS-US-2.
global:
  scrape_interval: 60s
  evaluation_interval: 60s

# The alert rule file is written by the configuration step (OBS-F-28) into the volume that is
# mounted here; the metric store sends no alert anywhere (OBS-F-8).
rule_files:
  - /etc/prometheus/generated/alert-rules.yml

otlp:
  # The unit and its version stay labels of every metric (OBS-F-11).
  promote_resource_attributes:
    - service.name
    - service.version
