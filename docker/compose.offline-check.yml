# Offline check of the local stack: SCF-T-8 (SCF-AC-2.3, start without internet).
# Added on top of docker-compose.yml, it turns both networks into internal ones, so no container
# has a route to the internet, and drops the published host ports, so the check runs next to
# another stack. Pull the images and build `web` first while online (the "images present" of
# SCF-T-8), then start with the example configuration unchanged:
#
#   docker compose -p stash-offline-check --env-file .env.example pull
#   docker compose -p stash-offline-check --env-file .env.example build web
#   docker compose -p stash-offline-check --env-file .env.example \
#     -f docker-compose.yml -f docker/compose.offline-check.yml \
#     up -d --pull never --no-build --wait
#   docker compose -p stash-offline-check ps        # every service running and healthy
#   docker compose -p stash-offline-check down -v   # remove containers and volumes
#
# On an ARM machine, clamav/clamav:1.5 needs `platform: linux/amd64` until #148 is decided.
networks:
  frontend:
    internal: true
  backend:
    internal: true

services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  mongodb:
    ports: !reset []
  couchdb:
    ports: !reset []
  seaweedfs:
    ports: !reset []
  mailpit:
    ports: !reset []
  proxy:
    ports: !reset []
