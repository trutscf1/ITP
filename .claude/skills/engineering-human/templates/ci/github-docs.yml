# Documentation checks (engineering-human). Copy to .github/workflows/docs.yml.
# Runs the markdown lint and the machine-readable contract check (tools/doc-check.mjs) on every
# pull request into dev or main and on pushes to them. Make the "docs" check required in the
# branch protection of dev and main, so a failing check blocks the merge (P-MR-3: green pipeline).
# --status compares the ROADMAP stages and the position rows with the merges and release tags in
# git (consistency check step 5, P-ROAD-4); in a pull request it counts the PR as merged, because
# the PR carries the status for the state after the merge. It needs the full history and the tags.

name: docs

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.23.2 "documentation/**/*.md"
      - name: Contract and status check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: node tools/doc-check.mjs documentation --status --pending-title "$PR_TITLE" --pending-branch "$PR_BRANCH"
