# Documentation checks (engineering-human). Copy to .gitlab/ci/docs.yml and include it from
# .gitlab-ci.yml:
#   include:
#     - local: .gitlab/ci/docs.yml
# Runs the markdown lint and the machine-readable contract check (tools/doc-check.mjs) on every
# merge request and on dev and main. A failing job blocks the merge (P-MR-3: green pipeline).
# --status compares the ROADMAP stages and the position rows with the merges and release tags in
# git (consistency check step 5, P-ROAD-4); in a merge request it counts the MR as merged, because
# the MR carries the status for the state after the merge. It needs the full history and the tags.

docs:
  stage: test
  image: node:24-alpine
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch --quiet --tags origin
  script:
    - npx --yes markdownlint-cli2@0.23.2 "documentation/**/*.md"
    - node tools/doc-check.mjs documentation --status --pending-title "$CI_MERGE_REQUEST_TITLE" --pending-branch "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
