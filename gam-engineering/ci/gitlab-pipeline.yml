# Generated by gam-engineering from gam-engineering/pipeline.json; regenerate it with /gam-engineering pipeline
# instead of editing it. Runs for merge requests and on the integration branch only.

.gam-engineering:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"

gam-limits:
  extends: .gam-engineering
  image:
    name: node:24-alpine
    entrypoint: [""]
  script:
    - node gam-engineering/tools/architecture-check.mjs limits

gam-guard:
  extends: .gam-engineering
  image:
    name: node:24-alpine
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch --quiet origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
  script:
    - GAM_GUARD_BASE="origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}" node gam-engineering/tools/floor-guard.mjs check

gam-eol:
  extends: .gam-engineering
  image:
    name: node:24-alpine
    entrypoint: [""]
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - node gam-engineering/tools/eol-check.mjs

gam-architecture-node:
  extends: .gam-engineering
  image:
    name: node:24-alpine
    entrypoint: [""]
  before_script:
    - corepack enable && pnpm install --frozen-lockfile
  script:
    - node gam-engineering/tools/architecture-check.mjs layers

gam-docs:
  extends: .gam-engineering
  image:
    name: node:24-alpine
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch --quiet --tags origin
  script:
    - node gam-ai-knowledge/tools/doc-check.mjs --status --pending-title "$CI_MERGE_REQUEST_TITLE" --pending-branch "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" --release-tag "$CI_COMMIT_TAG"
