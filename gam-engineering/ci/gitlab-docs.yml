# Markdown lint of the knowledge folder, included from .gitlab-ci.yml.
# Runs on every merge request and on dev and main; a failing job blocks the merge (P-MR-3: green pipeline).
# The machine-readable contract check (doc-check --status) runs in the generated
# gam-engineering/ci/gitlab-pipeline.yml (job gam-docs) since 2026-11-24 (Q364); this file keeps only the lint,
# which the generated pipeline does not run (Q295).

docs:
  stage: test
  image: node:24.14.0-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
  script:
    - npx --yes markdownlint-cli2@0.23.2 "gam-ai-knowledge/**/*.md"
