services:
  
  postgres:
    image: postgres:18-alpine
    container_name: stash_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stash_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-etc:/etc
      - postgres-data:/var/lib/postgresql
      
  mongo:
    image: mongo:9
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - backend
    ports:
      - ${MONGO_PORT}:27017

  # Object storage with an S3 interface. The master answers on 9333 once the server is up.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    command: ["server", "-dir=/data", "-filer", "-s3"]
    networks:
      - backend
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:?set SEAWEEDFS_S3_PORT in .env}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Virus scanner. The image brings its own health check script; the first start loads the
  # virus definitions, which takes a while. The image exists for amd64 only, so ARM machines
  # (Apple Silicon) run it emulated; it starts more slowly there (#148).
  clamav:
    image: clamav/clamav:1.5
    platform: linux/amd64
    restart: unless-stopped
    environment:
      # "true" keeps the scanner from downloading definitions, so it starts offline with the
      # ones in the image (SCF-AC-2.3); set "false" to update them while online.
      CLAMAV_NO_FRESHCLAMD: ${CLAMAV_NO_FRESHCLAMD:?set CLAMAV_NO_FRESHCLAMD in .env}
    networks:
      - backend
    ports:
      - ${CLAMD_PORT}:3310
      - ${CLAMAV_MILTER_PORT}:7357
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s


  # Local replacement for outgoing e-mail (SCF-AC-2.3): catches every message; the inbox is
  # at http://localhost:${MAILPIT_UI_PORT}.
  mailpit:
    image: axllent/mailpit:v1.32
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:?set MAILPIT_UI_PORT in .env}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  valkey:
    image: valkey/valkey:9.1-alpine
    command: valkey-server --port 6379 --requirepass ${VALKEY_PASSWORD}
    volumes:
      - valkey-data:/data
    networks:
      - backend
    ports:
      - ${VALKEY_PORT}:6379

  couchdb:
    image: apache/couchdb:3.5.0
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - couchdb-data:/opt/couchdb/data
    networks:
      - backend
    ports:
      - ${COUCHDB_INDEXER_ADMIN_PORT}:9100
      - ${COUCHDB_PORT}:5984
      - ${COUCHDB_EPMD_PORT}:4369

networks:
  frontend:
  backend:

volumes:
  postgres-data:
  postgres-etc:
  mongo-data:
  seaweedfs-data:
  valkey-data:
  couchdb-data:
  clamav-data: